# Local Postgres and Garage (S3-compatible media storage) for apps/api.
#
#   docker compose up -d        start
#   ./infra/garage/init.sh      provision Garage (first run only; idempotent)
#   docker compose down         stop, keeping data
#   docker compose down -v      stop and wipe the volumes
#
# The published Postgres port is 5433, not 5432, so this never collides with a
# Postgres already running on the host. Garage's S3 API is on 3900; only
# apps/api ever talks to it - browsers and the desktop client receive media
# through the API.

services:
  postgres:
    image: postgres:17-alpine
    container_name: quizzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizzer
      POSTGRES_PASSWORD: quizzer
      POSTGRES_DB: quizzer
    ports:
      - "5433:5432"
    volumes:
      - quizzer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzer -d quizzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: quizzer-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - quizzer-garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quizzer-pgdata:
  quizzer-garage:
